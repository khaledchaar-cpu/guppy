[workspace]
resolver = "3"
members = ["crates/guppy-core", "crates/guppy-app"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# smithay-clipboard with drops from other apps (see vendor/smithay-clipboard/src/dnd.rs).
[patch.crates-io]
smithay-clipboard = { path = "vendor/smithay-clipboard" }
