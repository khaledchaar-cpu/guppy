[package]
name = "guppy-core"
version = "0.5.0"
license = "MIT"
edition = "2024"

[dependencies]
libc = "0.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
nucleo-matcher = "0.3.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
trash = "5.2.9"
zip = { version = "9", default-features = false, features = ["deflate-flate2", "bzip2", "xz", "lzma"] }
tar = "0.4.46"
flate2 = "1.1.10"
ruzstd = "0.9.1"
bzip2 = "0.6.1"
lzma-rust2 = { version = "0.22.0", default-features = false, features = ["std", "xz"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", features = ["NSFileManager", "NSURL", "NSString", "NSError"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
