[package]
name = "guppy-app"
version = "0.4.1"
license = "MIT"
edition = "2024"

[dependencies]
# Only the image formats the viewer needs.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
guppy-core = { version = "0.4.1", path = "../guppy-core" }
iced = { version = "0.14.0", default-features = false, features = ["wgpu", "tiny-skia", "crisp", "web-colors", "x11", "wayland", "svg", "canvas", "smol", "image-without-codecs", "selector"] }
notify-debouncer-mini = "0.7.0"
smol = "2"
dirs = "7"

[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = "0.9.4"
# Patched in vendor/ to take drops from other apps.
smithay-clipboard = "0.7.3"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSURL", "NSString", "NSDictionary"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPasteboard"] }
